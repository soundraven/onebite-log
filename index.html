<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한입 로그</title>

    <meta property="og: title" content="한입 로그" />
    <meta
      property="og: description"
      content="한입 크기로 잘라먹는 SNS 프로젝트"
    />
    <meta property="og: image" content="/thumbnail.png" />

    <script>
      try {
        const themeStore = localStorage.getItem("ThemeStore")
          ? JSON.parse(localStorage.getItem("ThemeStore"))
          : null;

        const theme = themeStore.state.theme;

        const htmlTag = document.documentElement;

        // 1. 다크모드 여부 결정
        const isDark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);

        // 2. 한 번에 적용
        htmlTag.classList.toggle("dark", isDark);

        // (선택) 시스템 UI 색상도 같이 맞춰주기
        htmlTag.style.colorScheme = isDark ? "dark" : "light";
      } catch (error) {
        console.log(error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
